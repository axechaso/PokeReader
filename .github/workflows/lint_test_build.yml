name: Lint, Test, Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"
      - "!main"

jobs:
  offline-tools:
    name: Inspect-code tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - name: Exercise SD journal interruptions
        run: |
          cc -std=c11 -Wall -Wextra -Wno-pointer-to-int-cast -Itests/mock -I3gx/includes tests/test_time_lock_io.c 3gx/sources/time_lock_io.c -o /tmp/test-time-lock-io
          /tmp/test-time-lock-io

  lint-test-build:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    container: zaksabeast/devkitarm-rust@sha256:f0281f83cf4c072804a637d094ecabb83108234dbca309a027187cf4d5d6a990
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reproduce upstream baseline
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git worktree add --detach /tmp/pokereader-baseline 155de39c4b69de89a0f81381c60861bc21d10364
          make -C /tmp/pokereader-baseline
          sha256sum /tmp/pokereader-baseline/out/default.3gx > baseline-build.txt

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: make

      - name: Record build environment
        run: |
          {
            rustc +nightly-2024-03-21 --version
            arm-none-eabi-gcc --version
            if command -v dkp-pacman > /dev/null; then dkp-pacman -Q libctru; fi
            sha256sum /opt/devkitpro/libctru/lib/libctru.a
            sha256sum "$(command -v 3gxtool)"
            git rev-parse HEAD
            sha256sum out/default.3gx out/PokeReader-Time.3dsx
          } > out/build-info.txt
          cp baseline-build.txt out/
          cp docs/time-lock-development.zh-CN.md out/README-zh-CN.md
          cp profiles/manifest.json out/adapter-status.json

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PokeReader
          retention-days: 14
          path: out/
