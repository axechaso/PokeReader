name: Draft release

on:
  push:
    branches: [main]

jobs:
  canary-release:
    name: Canary release
    runs-on: ubuntu-latest
    container: zaksabeast/devkitarm-rust@sha256:f0281f83cf4c072804a637d094ecabb83108234dbca309a027187cf4d5d6a990
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint and test
        run: make lint test

      - name: Build
        run: make

      - name: "Set build timestamp"
        run: echo "build_timestamp=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT
        id: build_timestamp

      - name: "Set tag name"
        run: echo "tag_name=canary-$(date +'%Y-%m-%d-%H-%M')" >> $GITHUB_OUTPUT
        id: tag_name

      - name: Publish canary release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: true
          tag_name: ${{ steps.tag_name.outputs.tag_name }}
          name: ${{ format('Canary {0}', steps.build_timestamp.outputs.build_timestamp) }}
          body: ${{ github.event.head_commit.message }}
          files: |
            out/default.3gx
            out/PokeReader-Time.3dsx
            docs/time-lock-development.zh-CN.md
